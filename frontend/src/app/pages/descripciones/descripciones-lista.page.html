<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-button (click)="volver()">
        <ion-icon name="arrow-back-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>Descripciones</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="nuevo()">
        <ion-icon name="add-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>

  <ion-toolbar>
    <ion-searchbar
      [(ngModel)]="searchTerm"
      (ionInput)="filtrar($event)"
      placeholder="Buscar por código, descripción, color..."
      animated
    ></ion-searchbar>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-refresher slot="fixed" (ionRefresh)="cargarDescripciones()">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <ion-list *ngIf="!loading && descripcionesFiltradas.length > 0">
    <ion-item-sliding *ngFor="let descripcion of descripcionesFiltradas">
      <ion-item [button]="true" (click)="editar(descripcion)">
        <ion-icon 
          [name]="descripcion.codigo?.includes('P') ? 'cube-outline' : 'grid-outline'" 
          slot="start" 
          [color]="descripcion.activo ? 'primary' : 'medium'"
        ></ion-icon>
        
        <ion-label>
          <h2><strong>{{ descripcion.codigo }}</strong></h2>
          <p>{{ descripcion.descripcion }}</p>
          <p *ngIf="descripcion.color || descripcion.material">
            <ion-chip *ngIf="descripcion.color" outline>
              <ion-icon name="color-palette-outline"></ion-icon>
              <ion-label>{{ descripcion.color }}</ion-label>
            </ion-chip>
            <ion-chip *ngIf="descripcion.material" outline>
              <ion-icon name="construct-outline"></ion-icon>
              <ion-label>{{ descripcion.material }}</ion-label>
            </ion-chip>
          </p>
          <p *ngIf="descripcion.capacidad">
            <ion-icon name="scale-outline"></ion-icon>
            Capacidad: {{ descripcion.capacidad }} kg
          </p>
        </ion-label>

        <ion-badge [color]="descripcion.activo ? 'success' : 'danger'" slot="end">
          {{ descripcion.activo ? 'Activo' : 'Inactivo' }}
        </ion-badge>
      </ion-item>

      <ion-item-options side="start">
        <ion-item-option color="warning" (click)="toggleEstado(descripcion)">
          <ion-icon 
            slot="icon-only" 
            [name]="descripcion.activo ? 'eye-off-outline' : 'eye-outline'"
          ></ion-icon>
        </ion-item-option>
      </ion-item-options>

      <ion-item-options side="end">
        <ion-item-option color="danger" (click)="eliminar(descripcion)">
          <ion-icon slot="icon-only" name="trash-outline"></ion-icon>
        </ion-item-option>
      </ion-item-options>
    </ion-item-sliding>
  </ion-list>

  <div *ngIf="!loading && descripcionesFiltradas.length === 0" class="empty-state">
    <ion-icon name="file-tray-outline" size="large"></ion-icon>
    <p>No se encontraron descripciones</p>
    <ion-button (click)="nuevo()">
      <ion-icon name="add-outline" slot="start"></ion-icon>
      Nueva Descripción
    </ion-button>
  </div>

  <div *ngIf="loading" class="loading-state">
    <ion-spinner name="crescent"></ion-spinner>
    <p>Cargando descripciones...</p>
  </div>
</ion-content>
