<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-button (click)="volver()">
        <ion-icon name="arrow-back-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>Configuración</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-grid class="ion-padding">
    <ion-row>
      <ion-col size="12" size-md="6">
        <ion-card button (click)="navegarA('/clientes')">
          <ion-card-header>
            <ion-icon name="business" size="large" color="primary"></ion-icon>
            <ion-card-title>Clientes</ion-card-title>
          </ion-card-header>
          <ion-card-content>
            Administrar clientes con RUC, contacto y dirección
          </ion-card-content>
        </ion-card>
      </ion-col>

      <ion-col size="12" size-md="6">
        <ion-card button (click)="navegarA('/choferes')">
          <ion-card-header>
            <ion-icon name="person" size="large" color="secondary"></ion-icon>
            <ion-card-title>Choferes</ion-card-title>
          </ion-card-header>
          <ion-card-content>
            Administrar choferes con DNI, licencia y teléfono
          </ion-card-content>
        </ion-card>
      </ion-col>

      <ion-col size="12" size-md="6">
        <ion-card button (click)="navegarA('/placas')">
          <ion-card-header>
            <ion-icon name="car-sport" size="large" color="success"></ion-icon>
            <ion-card-title>Placas</ion-card-title>
          </ion-card-header>
          <ion-card-content>
            Administrar vehículos con placa, tipo, marca y modelo
          </ion-card-content>
        </ion-card>
      </ion-col>

      <ion-col size="12" size-md="6">
        <ion-card button (click)="navegarA('/descripciones')">
          <ion-card-header>
            <ion-icon name="cube" size="large" color="tertiary"></ion-icon>
            <ion-card-title>Jabas</ion-card-title>
          </ion-card-header>
          <ion-card-content>
            Administrar jabas y parihuelas con código y capacidad
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
